# ---------------------------------------------------------------------------
# Conflicts between the four source documents (CV, descriptive resume,
# Common App activities list, and the brief), with what the site shows.
# The site uses `chosen`. Edit `chosen` and the corresponding field above if
# a pick is wrong.
# ---------------------------------------------------------------------------
conflicts:
  davidson:
    sources:
      cv: Davidson Fellows Scholarship Finalist, one of 33 finalists nationwide and the only one from Texas
      resume: Davidson Fellow (2025), one of 60 selected nationally and the only recipient from Texas
      brief: Davidson Fellow, 1 of 33
    chosen: Davidson Fellows Scholarship Finalist (2025), one of 33 finalists named nationwide, the only one from Texas
    why: >-
      The Davidson Institute's 2025 page lists 33 names. The 21 scholarship
      recipients (the Fellows, sharing $825,000 per the Institute's press
      releases) are listed first; Krishiv is in the second group of 12, which
      another member of that group describes as Honorable Mention. "Fellow" is
      not supported, and "one of 60" does not match any count on the page.

  isef_scale:
    sources:
      cv: Nearly 1,700 finalists from 62 countries, regions, and territories
      resume: Roughly 1,600 finalists from approximately 180,000 competitors worldwide
    chosen: One of nearly 1,700 finalists from more than 60 countries, regions, and territories
    why: >-
      Society for Science's ISEF 2025 press release says "nearly 1,700 young
      scientists representing 48 U.S. states and more than 60 countries,
      regions and territories". The 180,000 figure describes affiliated-fair
      participation in general, not a selection pool, and is dropped.

  icbbs_status:
    sources:
      cv: Accepted, ICBBS 2026
      activities: (not stated)
      resume: Submitted to an international bioinformatics and computational biology conference, under review
    chosen: Accepted, ICBBS 2026
    why: >-
      The CV is the newest document (it includes summer 2026 events) and the
      served /cv.pdf says Accepted, so the site matches the PDF it links to.
      The resume is older and reads as the pre-decision status. If acceptance
      is not final, change publications[aml-icbbs-2026].status to under-review.

  shire_dates:
    sources:
      cv: Jun 2025 to Aug 2025
      resume: June 2025 to Present
      activities: 11 weeks, grade 10 break
    chosen: Jun 2025 to Aug 2025
    why: Shorter and newer claim; the activities list's 11 weeks also matches a summer internship.

  austin_energy:
    sources:
      cv: Jun 2024 to Aug 2024; 500,000+ accounts
      resume: May 2024 to August 2024; 500,000+ customers
      activities: serving almost 1M residents; 500,000+ accounts
    chosen: Summer 2024; 500,000+ accounts
    why: >-
      Month left unstated rather than picking May or June. "Accounts" appears
      in two of three documents and is the narrower unit; "almost 1M residents"
      describes the utility's service population, not the data analyzed.

  usabo:
    sources:
      cv: Top 225 of 12,000 (top 1.9%)
      resume: Top 225 nationally out of roughly 10,000 competitors each year
    chosen: Top 225 nationally, twice (denominator omitted)
    why: Both documents agree on 225; the participant count differs, so it is not shown.

  graduation_month:
    sources:
      cv: Expected May 2027
      resume: Expected June 2027
    chosen: Class of 2027 (month not shown)
    why: The month does not matter on a research site, so neither is shown.

  vex_coaching:
    sources:
      cv: Three regional titles, a Texas state championship, two state runner-up finishes, and three World Championship qualifications
      activities: 3 regionals; 1 state title, 2 runner-ups; 3 Worlds qualifiers
      resume: Two Texas state titles and qualified for the 2026 VEX Robotics World Championship
    chosen: Three regional titles, a Texas state championship, two state runner-up finishes, and a place at the 2026 World Championship
    why: >-
      One state title (two of three documents) rather than two. The CV's own
      honors list records coaching qualification only for 2026, so a single
