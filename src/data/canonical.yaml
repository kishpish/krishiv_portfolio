site:
  title: Krishiv Potluri
  description: >-
    Krishiv Potluri works at the intersection of machine learning, computational
    biology, and physics-based simulation: antibody design along transition
    paths, energy landscapes of leukemic cell states, de novo protein
    inhibitors, and patient-specific cardiac biomaterials.
  repo: https://github.com/kishpish/krishiv_portfolio
  repo_branch: main

research_statement:
  # Short version, used in metadata and structured data.
  short: >-
    I build models of systems that move across energy landscapes, and the
    infrastructure that makes those models reproducible.
  # Set the way the CV sets it: a bolded lead-in label, a colon, then running
  # prose with the key terms emphasised. Stored as HTML because the emphasis is
  # inside the sentence and a flat array cannot carry it.
  core_label: Core Research Interests
  core_html: >-
    My research lies at the intersection of <strong>machine learning</strong>,
    <strong>computational biology</strong>, and <strong>physics-based
    simulation</strong>, with a focus on the <strong>computational
    systems</strong> that make this work scalable and reproducible.
  directions_label: Current Directions
  directions_html: >-
    <strong>Physics-informed reinforcement learning</strong> for <em>de
    novo</em> antibody design; <strong>generative models</strong> for protein
    and biomaterial design; <strong>energy-based models</strong> of cancer cell
    states; <strong>leakage-audited benchmarks</strong> for genomic prediction;
    and <strong>efficient, reproducible systems</strong> for scientific
    computing.
  # Plain list, kept for JSON-LD knowsAbout where markup is not wanted.
  interests:
    - Physics-informed reinforcement learning for de novo antibody design
    - Generative models for protein and biomaterial design
    - Energy-based models of cancer cell states
    - Leakage-audited benchmarks for genomic prediction
    - Efficient, reproducible systems for scientific computing

# ---------------------------------------------------------------------------
# What is on the bench right now. One sentence each, newest first.
# ---------------------------------------------------------------------------
current_work:
  - title: Port-Hamiltonian Reinforcement Learning for De Novo Antibody Design
    note: >-
      A reinforcement learning policy that carries an explicit energy and
      dissipation term, so generating an antibody is choosing a path across a
      surface and paying for it rather than screening a library.
  - title: >-
      Port-Hamiltonian driven Structurally-Constrained Codon Optimization of
      circRNA IRES-CDS Junctions
    note: >-
      Recoding the junction between the internal ribosome entry site and the
      coding sequence so a circular RNA keeps its structure and still
      translates reliably.
  - title: >-
      Continuation and full lab validation of AI-Driven Inverse Design of
      Bio-Instructive Hydrogels for Myocardial Regeneration
    note: >-
      Taking the published inverse-design work off surrogate predictions and
      into the wet lab, so the shortlisted formulations are tested rather than
      proposed.

