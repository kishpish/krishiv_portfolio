# ---------------------------------------------------------------------------
# Methods and tools, grouped. Shown as a definition list, never as bars.
# ---------------------------------------------------------------------------
methods:
  - area: Machine learning
    items: >-
      Transformer pretraining and chemical language models; reinforcement
      learning and optimal control; score-based generative models and denoising
      score matching; physics-informed learning; nested cross-validation,
      leakage auditing, ablation design.
  - area: Simulation
    items: >-
      Steered molecular dynamics; free energy via the Jarzynski equality and
      PMF analysis; Langevin SDE integration; minimum-energy-path and string
      methods; Hessian and eigenmode analysis; mean first-passage time and
      committor calculation.
  - area: Computational biology
    items: >-
      Single-cell genomics (scanpy, AnnData, scvi-tools, CellTypist, Symphony);
      sequence models and in-silico mutagenesis (enformer-pytorch); genotype
      handling (pysam, bcftools, tabix over VCF, GRCh38, GENCODE, JASPAR); cell
      segmentation and morphological features from microscopy.
  - area: Statistical genetics
    items: >-
      cis-heritability by single-component REML; eQTL mapping and TWAS-style expression
      prediction; NNLS deconvolution of bulk expression; cross-ancestry
      portability.
  - area: Statistics
    items: >-
      Cox and LASSO-Cox survival models; ssGSEA and gseapy enrichment;
      nonparametric tests with Benjamini-Hochberg correction; bootstrap
      intervals; permutation and negative controls.
  - area: Systems
    items: >-
      Python, R, Java, Bash; PyTorch and CUDA; distributed training on 16
      A100s; A100 and H100 cloud workflows; AWS, Docker, Git, Linux; pinned
      environments and containerized pipelines.

